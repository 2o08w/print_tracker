<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pengaturan — Print Business Tracker</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app">
  <div id="shell-sidebar"></div>

  <div class="main">
    <div id="shell-topbar"></div>

    <div class="content">
      <div class="page-header">
        <div>
          <h1>Pengaturan</h1>
          <p>Kelola informasi usaha dan konfigurasi bisnis</p>
        </div>
      </div>

      <form id="settingsForm">
        <div class="card">
          <div class="settings-section-title">Informasi Usaha</div>
          <div class="two-col">
            <div class="form-group">
              <label for="sNamaUsaha">Nama Usaha</label>
              <input type="text" id="sNamaUsaha" placeholder="Contoh: Wawa Print" />
            </div>
            <div class="form-group">
              <label for="sNamaPengguna">Nama Pengguna</label>
              <input type="text" id="sNamaPengguna" placeholder="Contoh: Pemilik" />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="settings-section-title">Pembagian Keuntungan</div>
          <div class="two-col">
            <div class="form-group">
              <label for="sPersenSaya">Persentase Bagian Saya (%)</label>
              <input type="number" id="sPersenSaya" min="0" max="100" step="1" />
            </div>
            <div class="form-group">
              <label for="sPersenUsaha">Persentase Bagian Usaha (%)</label>
              <input type="number" id="sPersenUsaha" min="0" max="100" step="1" readonly />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="settings-section-title">Target</div>
          <div class="form-group">
            <label for="sTarget">Target Bagian Saya (Rp)</label>
            <input type="number" id="sTarget" min="0" step="1000" />
          </div>
        </div>

        <div class="card">
          <div class="settings-section-title">Mata Uang</div>
          <div class="form-group">
            <label for="sMataUang">Mata Uang</label>
            <select id="sMataUang">
              <option value="Rp">Rupiah (Rp)</option>
            </select>
          </div>
        </div>

        <div class="card">
          <div class="settings-section-title">Biaya Kertas</div>
          <div class="two-col">
            <div class="form-group">
              <label for="cKertasA4">A4 (Rp / lembar)</label>
              <input type="number" id="cKertasA4" min="0" step="1" />
            </div>
            <div class="form-group">
              <label for="cKertasF4">F4 (Rp / lembar)</label>
              <input type="number" id="cKertasF4" min="0" step="1" />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="settings-section-title">Biaya Tinta</div>
          <div class="two-col">
            <div class="form-group">
              <label for="cTintaBW">Hitam Putih (Rp / lembar)</label>
              <input type="number" id="cTintaBW" min="0" step="1" />
            </div>
            <div class="form-group">
              <label for="cTintaWarna">Full Warna (Rp / lembar)</label>
              <input type="number" id="cTintaWarna" min="0" step="1" />
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Simpan Pengaturan</button>
      </form>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/pengaturan.js"></script>
</body>
</html>
